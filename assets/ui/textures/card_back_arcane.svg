  <g fill="none" stroke-linecap="round">
    <circle cx="405" cy="608" r="226" stroke="#e3c77d" stroke-opacity="0.34" stroke-width="2"/>
    <circle cx="405" cy="608" r="205" stroke="#8f73bb" stroke-opacity="0.82" stroke-width="4"/>
