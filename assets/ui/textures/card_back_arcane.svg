    <path d="M405 382V834M179 608H631" stroke="#e3c77d" stroke-opacity="0.22" stroke-width="2"/>
    <path d="M245 448L565 768M565 448L245 768" stroke="#8f73bb" stroke-opacity="0.26" stroke-width="2"/>
