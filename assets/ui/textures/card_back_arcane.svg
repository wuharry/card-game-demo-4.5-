<svg xmlns="http://www.w3.org/2000/svg" width="1620" height="2432" viewBox="0 0 810 1216">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111329"/>
      <stop offset="0.5" stop-color="#080a16"/>
      <stop offset="1" stop-color="#17112a"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8f73bb" stop-opacity="0.42"/>
      <stop offset="0.55" stop-color="#2d2149" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#080a16" stop-opacity="0"/>
